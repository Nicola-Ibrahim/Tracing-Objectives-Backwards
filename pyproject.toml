[project]
name = "pareto-optimization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.2.1",
    "coco-experiment>=2.8.1",
    "cocopp>=2.7.3",
    "h5py>=3.15.1",
    "hdbscan>=0.8.40",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "kaleido>=1.2.0",
    "matplotlib>=3.10.1",
    "nbformat>=5.10.4",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "pip>=25.1.1",
    "plotly[express]>=6.0.1",
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.11.5",
    "pykrige>=1.7.2",
    "pymoo>=0.6.1.3",
    "requests>=2.32.3",
    "safetensors>=0.7.0",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "sklearn-som>=1.1.0",
    "torch>=2.7.0",
    "tqdm>=4.67.1",
    "umap-learn>=0.5.9.post2",
    "wandb>=0.20.1",
    "dependency-injector>=4.48.3",
    "redis>=5.0.0",
    "arq>=0.25.0",
]


[dependency-groups]
dev = [
    "poethepoet>=0.40.0",
    "pytest-playwright>=0.5.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.3.0",
]



[tool.poe.tasks]

# ====================================================================================
# 1. Server Tasks
# ====================================================================================

[tool.poe.tasks.serve]
shell = "fastapi dev src/api/main.py"
help = "SERVE: Run the FastAPI web server. Usage: poe serve"

[tool.poe.tasks.test]

cmd = "pytest"
help = "TEST: Run the test suite with best-practice flags. Usage: poe test"

[tool.poe.tasks.test-cov]
cmd = "pytest --cov=src --cov-report=term-missing --cov-report=html"
help = "TEST COV: Run tests with coverage reporting. Usage: poe test-cov"

[tool.poe.tasks.lint]
cmd = "ruff check ."
help = "LINT: Check for linting issues using ruff. Usage: poe lint"

[tool.poe.tasks.lint-fix]
cmd = "ruff check . --fix"
help = "LINT FIX: Automatically fix linting issues. Usage: poe lint-fix"

[tool.poe.tasks.format]
cmd = "ruff format ."
help = "FORMAT: Automatically format code using ruff. Usage: poe format"

[tool.poe.tasks.check]
sequence = ["lint", "format"]
ignore_fail = false
help = "CHECK: Run linting and formatting checks. Usage: poe check"


[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".venv", ".git", "notebooks", "__pycache__", "dist"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::pydantic.PydanticDeprecatedSince20",
    "ignore::DeprecationWarning:starlette.*",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
